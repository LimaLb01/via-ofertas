name: ofertas-diarias

on:
  schedule:
    - cron: "0 9 * * *"   # 06:00 em Brasília
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar ofertas
        env:
          VIA_LOGIN: ${{ secrets.VIA_LOGIN }}
          VIA_SENHA: ${{ secrets.VIA_SENHA }}
          VIA_XAPIKEY: ${{ secrets.VIA_XAPIKEY }}
          VIA_LOJA: "8"
        run: python coletar.py
      - name: Salvar histórico
        run: |
          git config user.name "via-ofertas-bot"
          git config user.email "via-ofertas-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "ofertas $(date -u +%F)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
